// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()            // Añadido: Repositorio oficial de Android
        mavenCentral()      // Añadido: El reemplazo actual de JCenter
        jcenter()           // Lo dejamos por si queda algo antiguo, pero al final
    }
    dependencies {
        // Actualizado de 2.0.0-beta5 a 2.1.0 (versión estable y disponible)
        classpath 'com.android.tools.build:gradle:2.1.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
